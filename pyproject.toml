[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quartermaster"
version = "0.1.0"
description = "A table continuity companion for a Discord D&D campaign"
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.6,<3",
]

[project.optional-dependencies]
# The Activity surface. Optional because the export CLI and the bot both have
# to keep running for a table that has not enabled it. aiohttp is not listed:
# discord.py already requires it, and the OAuth exchange uses that one.
activity = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    # The live feed. uvicorn speaks HTTP without this and answers a WebSocket
    # upgrade with 404, which would look like a missing route rather than a
    # missing dependency. The test suite does not need it — Starlette's test
    # client runs a socket in-process — so it is here rather than in dev.
    "websockets>=13",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[tool.uv]
package = true

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 140
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
