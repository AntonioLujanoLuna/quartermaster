[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quartermaster"
version = "0.1.0"
description = "A table continuity companion for a Discord D&D campaign"
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.6,<3",
]

[dependency-groups]
dev = []

[tool.uv]
package = true

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
