name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Synchronize the environment
        run: uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -q

  activity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: activity/package-lock.json

      - name: Install the Activity's dependencies
        working-directory: activity
        run: npm ci

      # A build proves the module graph parses and resolves. It does not notice
      # a handler nobody calls or a shadowed variable, and it cannot notice a
      # screen that throws when a read has not landed yet — which is the failure
      # that reaches a table mid-evening rather than a pull request.
      - name: Lint the Activity
        working-directory: activity
        run: npm run lint

      - name: Check the Activity's formatting
        working-directory: activity
        run: npm run format:check

      - name: Test the Activity
        working-directory: activity
        run: npm test

      # A client id is needed to build, not to be correct: the value is read at
      # runtime and a placeholder is enough to prove the bundle compiles.
      - name: Build the Activity
        working-directory: activity
        env:
          VITE_DISCORD_CLIENT_ID: "0"
        run: npm run build

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Stage 0's machine half, on every pull request. This serves the real
      # application and asks it what the first launch will ask, which is the
      # only way the two failures it exists for get caught: a WebSocket
      # implementation that is in the activity extra and in nothing the tests
      # need, and a bundle built without a client id that compiles, serves, and
      # contains no application.
      - name: Check the Activity can actually be served
        env:
          QM_GUILD_ID: "1"
          QM_DISCORD_CLIENT_ID: "1"
          QM_DISCORD_CLIENT_SECRET: "a-placeholder-secret"
          QM_ACTIVITY_DIST: activity/dist
          QM_API_BIND: 127.0.0.1:8080
        run: uv run --extra activity python -m quartermaster preflight
